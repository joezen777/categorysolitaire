<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#153a37;color:white;font:14px system-ui;touch-action:none}main{width:380px;margin:auto;position:relative;height:700px}header{height:44px;display:flex;justify-content:space-between;align-items:center}.card{position:absolute;width:72px;height:100px;border:1px solid #b7cac4;border-radius:5px;background:#fff;color:#173632;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;user-select:none;touch-action:none;font-size:12px}.card small{font-size:10px}.card strong{font-size:13px}.back{background:#8e3548;color:white;justify-content:flex-start;padding-top:1px}.slot{background:transparent;color:#ccdcd8;border-style:dashed}.title{background:#dad8fc}.card[aria-selected=true]{outline:3px solid gold}#message{position:absolute;top:580px;text-align:center;width:100%;font-size:24px}button{font:inherit}
</style></head><body><main><header><span id="score"></span><button id="restart">Restart</button></header><section id="board"></section><div id="message" role="status"></div></main><script>
// Controlled calibration app. No oracle or observer implementation is imported.
const catalog=__DECK__;
const mutation=new URLSearchParams(location.search).get('mutation')||'none';
let piles,stock,waste,homes,score,completed,selected,press;
const flat=Object.entries(catalog).flatMap(([category,items])=>[{label:category,category,title:true},...items.map(label=>({label,category,title:false}))]);
function reset(){let offset=0;piles=[4,5,6,7,8].map(n=>{const p=flat.slice(offset,offset+n).reverse().map(c=>({...c,up:false}));offset+=n;p.at(-1).up=true;return p;});stock=flat.slice(30).map(c=>({...c,up:false}));waste=[];homes=Array(5).fill(null);score=0;completed=0;selected=null;render();}
function cardHTML(c){return c.title?`<small>Title card</small><strong>${c.label}</strong><small>${catalog[c.category].length} items</small>`:`<small>${c.category}</small><strong>${c.label}</strong>`;}
function box(x,y,html,zone,index,extra=''){return `<div class="card ${extra}" style="left:${x}px;top:${y}px" data-zone="${zone}" data-index="${index}" aria-selected="${selected?.zone===zone&&selected?.index===index}">${html}</div>`;}
function render(){document.querySelector('#score').textContent='Score: '+score;let html=box(0,52,stock.length?`♦<small>Stock ${stock.length}</small>`:mutation==='unicode-recycle'?'♻️':'Recycle', 'stock',0,stock.length?'back':'slot');html+=box(76,52,waste.length?cardHTML(waste.at(-1))+`<small>Waste ${waste.length}</small>`:'Empty','waste',0,waste.length?'':'slot');
 homes.forEach((f,i)=>html+=box(i*76,170,f?`<strong>${f.category}</strong><small>${f.items.length+(mutation==='wrong-progress'?1:0)}/${catalog[f.category].length-(mutation==='wrong-denominator'?1:0)}</small>${f.items.length?`<span>${f.items.at(-1)}</span>`:'<small>Title card</small>'}`:'Title','foundation',i,f?'title':'slot'));
 piles.forEach((pile,i)=>{if(!pile.length)html+=box(i*76,286,'Empty','tableau',i,'slot');pile.forEach((c,j)=>html+=box(i*76,286+j*18,c.up?cardHTML(c):'♦','tableau',i,c.up?(c.title?'title':''):'back'));});document.querySelector('#board').innerHTML=html;document.querySelector('#message').textContent=(completed===13&&mutation!=='missing-modal')||mutation==='premature-win'?'You win!':'';
}
function source(s){return s.zone==='waste'?waste.at(-1):s.zone==='tableau'?piles[s.index].at(-1):null;}
function remove(s){const list=s.zone==='waste'?waste:piles[s.index];const c=mutation==='duplicate-card'?list.at(-1):list.pop();if(mutation==='lose-card'&&list.length)list.pop();if(s.zone==='tableau'&&list.length&&mutation!=='no-reveal')list.at(-1).up=true;return c;}
function move(s,d){const c=source(s);if(!c||c.up===false||s.zone===d.zone&&s.index===d.index)return;
 if(d.zone==='foundation'){const f=homes[d.index];const legal=c.title?!f:f&&f.category===c.category;if(!legal&&mutation!=='accept-illegal')return;if(legal&&mutation==='reject-legal')return;remove(s);if(c.title)homes[d.index]={category:c.category,items:[]};else{if(!homes[d.index])homes[d.index]={category:c.category,items:[]};homes[d.index].items.push(c.label);if(homes[d.index].items.length===catalog[homes[d.index].category].length){homes[d.index]=null;completed++;score+=mutation==='wrong-score'?10:100;}}}
 else if(d.zone==='tableau'){const p=piles[d.index],t=p.at(-1);if(t&&(t.title||t.category!==c.category)&&mutation!=='accept-illegal')return;if(mutation==='reject-legal')return;p.push({...remove(s),up:true});}
 selected=null;render();}
function activate(d){if(d.zone==='stock'){if(stock.length){waste.push({...stock.shift(),up:true});if(mutation==='double-draw'&&stock.length)waste.push({...stock.shift(),up:true});}else{stock=waste.map(c=>({...c,up:false}));if(mutation==='reverse-recycle')stock.reverse();waste=[];}selected=null;render();return;}if(selected){const old=selected;move(old,d);if(selected){selected=null;render();}}else if(source(d)){selected=d;render();}}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-zone]');if(!el)return;press={zone:el.dataset.zone,index:Number(el.dataset.index),x:e.clientX,y:e.clientY};});
document.addEventListener('pointerup',e=>{if(!press)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]');const from=press;press=null;if(!el)return;const to={zone:el.dataset.zone,index:Number(el.dataset.index)};if(Math.hypot(e.clientX-from.x,e.clientY-from.y)>10)move(from,to);else activate(to);});
document.querySelector('#restart').onclick=reset;reset();
</script></body></html>
